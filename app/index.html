<style id="splashCss">
#splash{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;overflow:hidden;background-color:var(--bg,#0b3f3b);background-image:var(--bg-img,none);color:var(--ink,#e6fffb);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:opacity .45s ease,transform .45s ease}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
#splash .sp-glow{position:absolute;width:140vmax;height:140vmax;left:50%;top:50%;margin:-70vmax 0 0 -70vmax;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent,#2dd4bf) 30%,transparent),transparent 70%);animation:spPulse 3.2s ease-in-out infinite}
#splash .sp-mid{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;padding:24px;text-align:center}
#splash .sp-logo{width:104px;height:104px;border-radius:28px;box-shadow:0 18px 50px -10px rgba(0,0,0,.55);animation:spPop .7s cubic-bezier(.2,1.4,.4,1) both}
#splash .sp-logo svg{display:block;width:100%;height:100%}
#splash .sp-name{font-size:30px;font-weight:800;letter-spacing:-.04em;animation:spUp .6s .15s both}#splash .sp-name i{font-style:normal;color:var(--accent,#ffc94d)}
#splash .sp-msg{min-height:24px;font-size:16px;font-weight:600;color:var(--accent,#99f6e4);opacity:0;transition:opacity .35s ease,transform .35s ease;transform:translateY(6px)}
#splash .sp-msg.on{opacity:1;transform:none}
#splash .sp-bar{width:120px;height:4px;border-radius:2px;background:color-mix(in srgb,var(--ink,#fff) 16%,transparent);overflow:hidden}#splash .sp-bar i{display:block;width:40%;height:100%;border-radius:2px;background:var(--accent,#ffc94d);animation:spBar 1.3s ease-in-out infinite}
#splash .sp-f{position:absolute;display:grid;place-items:center;font-weight:800;color:var(--ink,#fff);opacity:0;animation:spFloat var(--d,5s) var(--w,0s) ease-in-out infinite}
#splash .sp-coin{width:34px;height:34px;border-radius:50%;background:var(--accent,#ffc94d);color:var(--accent-ink,#fff);font-size:18px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
#splash .sp-bill{width:52px;height:30px;border-radius:6px;background:color-mix(in srgb,var(--accent,#5eead4) 55%,var(--surface,#fff));color:var(--ink,#0f4f49);font-size:15px}
#splash .sp-chip{padding:5px 11px;border-radius:99px;background:color-mix(in srgb,var(--ink,#fff) 12%,transparent);font-size:13px}
#splash .sp-bell{width:32px;height:32px;border-radius:50%;background:var(--surface,#fff);color:var(--accent,#0f766e);font-size:16px}
@keyframes spPop{from{transform:scale(.5) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes spUp{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@keyframes spBar{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
@keyframes spPulse{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.05);opacity:1}}
@keyframes spFloat{0%{opacity:0;transform:translateY(26px) rotate(-8deg) scale(.8)}18%{opacity:.95}70%{opacity:.85}100%{opacity:0;transform:translateY(-70px) rotate(10deg) scale(1)}}
@media (prefers-reduced-motion:reduce){#splash .sp-f,#splash .sp-glow,#splash .sp-bar i{animation:none}#splash .sp-f{display:none}}
#splash .sp-char{position:absolute;right:max(4vw,10px);bottom:max(6vh,24px);width:clamp(130px,34vmin,260px);height:auto;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35));animation:spChar .9s .2s cubic-bezier(.2,1.3,.4,1) both,spBob 3s 1.1s ease-in-out infinite}
#splash .sp-img{position:absolute;width:clamp(44px,11vmin,84px);height:auto;opacity:0;animation:spFloat var(--d,5s) var(--w,0s) ease-in-out infinite;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
#splash[data-art] .sp-coin,#splash[data-art] .sp-bill{display:none}
@keyframes spChar{from{transform:translateY(60px) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes spBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
#splash[data-skin-art=vader] .sp-char{filter:drop-shadow(0 0 3px rgba(255,255,255,.55)) drop-shadow(0 0 22px rgba(255,255,255,.22)) drop-shadow(0 10px 18px rgba(0,0,0,.5))}
@media (prefers-reduced-motion:reduce){#splash .sp-char{animation:none}#splash .sp-img{display:none}}
</style>
